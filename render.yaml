services:
  - type: web
    name: ai-investigation-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn unified_server:app --timeout 120
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      - key: PYTHONUNBUFFERED
        value: true
      - key: FRONTEND_URL
        value: https://aijusticegrid.netlify.app
      - key: PDF_DOWNLOAD_ENABLED
        value: true
      - key: PDF_MAX_SIZE_MB
        value: 10