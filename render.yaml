services:
  - type: web
    name: ai-investigation-backend
    env: python
    buildCommand: pip install flask flask-cors gunicorn
    startCommand: gunicorn minimal_server:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1 --log-level info
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: FLASK_ENV
        value: production