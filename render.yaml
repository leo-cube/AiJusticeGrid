services:
  - type: web
    name: ai-investigation-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn unified_server:app --bind 0.0.0.0:$5000 --timeout 120 --workers 1 --log-level info
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: FRONTEND_URL
        value: https://aijusticegrid.netlify.app
      - key: PDF_DOWNLOAD_ENABLED
        value: "true"
      - key: PDF_MAX_SIZE_MB
        value: "10"
      - key: FLASK_ENV
        value: production